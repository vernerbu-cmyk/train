<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Таблицы</title>

<style>
:root{
  --blue:#1E3F8A;
  --orange:#FF6A00;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
}

.header{
  background:var(--blue);
  color:#fff;
  text-align:center;
  font-style:italic;
  font-size:24px;
  padding:14px;
}

#status{
  text-align:center;
  padding:6px;
  font-weight:600;
  font-size:14px;
}

/* ===== CONTROLS ===== */
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  padding:12px;
  align-items:center;
}

label{
  font-size:14px;
}

button{
  background:var(--orange);
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 4px 0 #b84a00;
}

button:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #b84a00;
}

/* ===== GRID ===== */
#grid{
  display:grid;
  gap:10px;
  max-width:1000px;
  margin:20px auto;
  padding:0 10px;
  grid-auto-rows:1fr;
}

/* ===== CARD ===== */
.cell{
  background:#fff;
  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  user-select:none;
  cursor:pointer;

  box-shadow:0 6px 18px rgba(0,0,0,0.08);

  padding:18px;

  word-break:break-word;
  overflow-wrap:anywhere;
  white-space:normal;

  transition:0.15s;
}

.cell.hidden{
  background:var(--orange);
  color:transparent;
}

/* ===== FOOTER ===== */
.footer{
  position:fixed;
  bottom:8px;
  right:10px;
  font-size:11px;
  color:#888;
}

/* ===== MOBILE ===== */
@media (max-width:600px){
  .cell{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="header">Таблицы</div>

<div id="status">⏳ загрузка...</div>

<div class="controls">

  <label>Строки <input id="rows" type="number" value="5"></label>
  <label>Столбцы <input id="cols" type="number" value="5"></label>

  <label><input id="v1" type="checkbox" checked> 1</label>
  <label><input id="v2" type="checkbox" checked> 2</label>
  <label><input id="v3" type="checkbox" checked> 3</label>
  <label><input id="v4" type="checkbox" checked> 4</label>
  <label><input id="v5" type="checkbox" checked> 5+</label>

  <!-- РЕЖИМЫ -->
  <label>
    <input id="bigMode" type="checkbox">
    крупные карточки
  </label>

  <label>
    <input id="ultraMode" type="checkbox">
    слабовидящие
  </label>

  <button onclick="generate()">Сгенерировать</button>

</div>

<div id="grid"></div>

<div class="footer">© verner</div>

<script>
let words = [];
const grid = document.getElementById("grid");
const status = document.getElementById("status");

const vowels = "аоуыэиеёюя";

/* ===== LOAD ===== */
async function load(){
  try{
    status.textContent = "⏳ загрузка JSON...";

    const res = await fetch("./words.json?v=" + Date.now());
    const data = await res.json();

    words = Array.isArray(data) ? data : (data.words || []);

    status.textContent = "✔ слов: " + words.length;

  }catch(e){
    console.error(e);
    status.textContent = "❌ JSON не загрузился";
  }
}

/* ===== GENERATE ===== */
function generate(){

  const r = +rows.value || 5;
  const c = +cols.value || 5;
  const need = r * c;

  let pool = words.filter(w=>{

    const v = [...w.toLowerCase()]
      .filter(ch => vowels.includes(ch)).length;

    return (
      (v1.checked && v === 1) ||
      (v2.checked && v === 2) ||
      (v3.checked && v === 3) ||
      (v4.checked && v === 4) ||
      (v5.checked && v >= 5)
    );
  });

  if(pool.length < need){
    pool = [...pool, ...words];
  }

  pool = pool.sort(()=>Math.random()-0.5).slice(0, need);

  render(pool, c);
}

/* ===== RENDER ===== */
function render(list, cols){

  grid.innerHTML = "";

  grid.style.gridTemplateColumns =
    `repeat(${cols}, minmax(0, 1fr))`;

  const big = bigMode.checked;
  const ultra = ultraMode.checked;

  list.forEach(word=>{

    const div = document.createElement("div");
    div.className = "cell";

    div.textContent = word;

    const len = word.length;

    /* =========================
       УМНЫЙ РАЗМЕР ШРИФТА
    ========================= */
    let size = 28;

    if(big){
      size = 44;
    }

    if(ultra){
      size = 54;
    }

    // авто-уменьшение для длинных слов
    if(len > 8) size -= 4;
    if(len > 12) size -= 8;
    if(len > 16) size -= 12;
    if(len > 20) size -= 16;

    div.style.fontSize = size + "px";

    // padding тоже адаптивный
    if(ultra){
      div.style.padding = "34px";
    } else if(big){
      div.style.padding = "28px";
    } else {
      div.style.padding = "18px";
    }

    div.onclick = ()=>div.classList.toggle("hidden");

    grid.appendChild(div);
  });
}

load();
</script>

</body>
</html>
