<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лавина</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#fffaf2;
}

/* HEADER */
header{
  background:#1E3F8A;
  color:white;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}

.logo{
  font-style: italic;
  font-size:22px;
  flex:1;
  text-align:center;
}

/* SPEED */
.speed{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
}

input[type=range]{ width:120px; }

/* LEVELS */
.levels{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.levels button{
  background:#FF6A00;
  color:white;
  border:none;
  padding:4px 10px;
  border-radius:6px;
  box-shadow:0 3px 0 #c84f00;
  cursor:pointer;
}

.levels button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #c84f00;
}

/* TOGGLES */
.toggles{
  display:flex;
  gap:10px;
  font-size:13px;
}

/* BUTTONS */
.controls{
  margin:12px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

button.main{
  font-size:16px;
  padding:8px 16px;
  background:#FF6A00;
  color:white;
  border:none;
  border-radius:6px;
  box-shadow:0 4px 0 #c84f00;
  cursor:pointer;
}

button.main:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #c84f00;
}

/* SETTINGS */
#settings{
  display:none;
  background:#fff3e0;
  padding:12px;
}

#settings textarea,
#settings select{
  width:100%;
  margin-top:8px;
  font-size:15px;
}

/* TEXT */
#text{
  padding:20px;
  max-width:900px;
  margin:auto;
  font-size:28px;
  line-height:1.6;
  text-align:justify;
  background:white;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* INFO */
#words,#time{
  position:fixed;
  right:10px;
  padding:6px 10px;
  border-radius:6px;
  font-size:14px;
}

#words{ bottom:10px; background:#ffe0b2; }
#time{ bottom:48px; background:#c8e6c9; }

/* COPYRIGHT */
.copyright{
  position:fixed;
  bottom:6px;
  right:10px;
  font-size:11px;
  opacity:0.6;
}

/* MOBILE */
@media(max-width:600px){
  header{
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .logo{ font-size:18px; }
}
</style>
</head>

<body>

<header>
  <div class="speed">
    <span>медл</span>
    <input id="speed" type="range" min="0" max="9" value="4">
    <span>быстр</span>
  </div>

  <div class="logo">ЛАВИНА</div>

  <div class="toggles">
    <label><input type="checkbox" id="paint"> белый</label>
    <label><input type="checkbox" id="reverseMode"> реверс</label>
  </div>

  <div class="levels">
    <button onclick="setLevel('level_1')">1</button>
    <button onclick="setLevel('level_2')">2</button>
    <button onclick="setLevel('level_3')">3</button>
    <button onclick="setLevel('level_4')">4</button>
  </div>
</header>

<div class="controls">
  <button class="main" id="start">Старт</button>
  <button class="main" id="stop">Стоп</button>
  <button class="main" id="repeat">Повтор</button>
  <button class="main" id="toggleSettings">Настройки</button>
</div>

<div id="settings">
  <select id="selector"></select>
  <textarea id="newText"></textarea>
  <button class="main" id="add">Добавить</button>
</div>

<div id="text"></div>
<div id="words"></div>
<div id="time">Время: 0 сек</div>
<div class="copyright">© verner</div>

<script>

const speeds=[2,1.75,1.5,1.25,1,0.75,0.5,0.4,0.25,0.1];

let data = {};
let texts = [];
let currentLevel = "level_1";

let spans=[], originalWords=[];
let i=0, running=false, timer=null;
let startTime=0, clockInterval=null;

/* UI */
const textBox=document.getElementById("text");
const selector=document.getElementById("selector");
const wordsBox=document.getElementById("words");
const timeBox=document.getElementById("time");
const paint=document.getElementById("paint");
const reverseMode=document.getElementById("reverseMode");
const speed=document.getElementById("speed");
const newText=document.getElementById("newText");

/* LOAD JSON */
async function loadData(){
  const res = await fetch("texts2.json");
  data = await res.json();
  setLevel("level_1");
}
loadData();

/* LEVEL SWITCH */
function setLevel(level){
  if(!data[level]) return;

  currentLevel = level;
  texts = data[level].texts || [];

  updateSelector();
  selector.value = 0;
  showText();
}

/* SELECTOR */
function updateSelector(){
  selector.innerHTML="";
  texts.forEach((_,idx)=>{
    const o=document.createElement("option");
    o.value=idx;
    o.textContent="Текст "+(idx+1);
    selector.appendChild(o);
  });
}

/* FORMAT */
function formatWord(word){
  if(reverseMode.checked){
    let punct="";
    if(/[\.,!?:;]$/.test(word)){
      punct = word.slice(-1);
      word = word.slice(0,-1);
    }
    return word.split("").reverse().join("") + punct;
  }
  return word;
}

/* SHOW */
function showText(){
  if(!texts.length) return;

  let t = texts[selector.value]?.text || texts[selector.value];
  originalWords=t.split(" ");

  textBox.innerHTML=originalWords
    .map(w=>`<span>${formatWord(w)}</span>`)
    .join(" ");

  spans=[...textBox.querySelectorAll("span")];

  wordsBox.textContent="Слов: "+spans.length;
  timeBox.textContent="Время: 0 сек";
  i=0;
}

/* TIMER */
function startClock(){
  clockInterval=setInterval(()=>{
    let s=Math.floor((Date.now()-startTime)/1000);
    timeBox.textContent="Время: "+s+" сек";
  },200);
}

function stopClock(){
  clearInterval(clockInterval);
}

/* DISAPPEAR */
function disappearWord(){
  if(!running || i>=spans.length) return;

  for(let j=i;j<spans.length;j++){
    spans[j].textContent=formatWord(originalWords[j]);
  }

  if(paint.checked) spans[i].style.color="white";
  else spans[i].style.display="none";

  i++;

  wordsBox.textContent="Слов: "+(spans.length-i);

  if(i<spans.length){
    timer=setTimeout(disappearWord, speeds[speed.value]*1000);
  }else{
    running=false;
    stopClock();
  }
}

/* CONTROLS */
document.getElementById("start").onclick=()=>{
  document.getElementById("stop").onclick();
  running=true;
  i=0;
  startTime=Date.now();
  startClock();
  disappearWord();
};

document.getElementById("stop").onclick=()=>{
  running=false;
  clearTimeout(timer);
  stopClock();
};

document.getElementById("repeat").onclick=()=>{
  document.getElementById("stop").onclick();
  showText();
  running=true;
  startTime=Date.now();
  startClock();
  disappearWord();
};

/* SPEED LIVE */
speed.oninput=()=>{
  if(running){
    clearTimeout(timer);
    timer=setTimeout(disappearWord, speeds[speed.value]*1000);
  }
};

/* UI */
selector.onchange=showText;

document.getElementById("toggleSettings").onclick=()=>{
  const s=document.getElementById("settings");
  s.style.display = s.style.display==="block"?"none":"block";
};

document.getElementById("add").onclick=()=>{
  const t=newText.value.trim();
  if(!t) return;
  texts.push({id:texts.length+1,text:t});
  updateSelector();
};

</script>
</body>
</html>
