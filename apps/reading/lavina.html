<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЛАВИНА</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#fffaf2;
}

/* HEADER */
header{
  background:#1E3F8A;
  color:white;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-weight:bold;
  font-size:22px;
  font-style:italic;
}

/* SPEED */
.speed{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
}

input[type=range]{
  width:120px;
}

/* TOGGLES */
.toggles{
  display:flex;
  gap:10px;
  font-size:13px;
}

/* FONT */
.font-controls{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
}

#fontSize{
  width:90px;
}

#fontFamily{
  font-size:13px;
}

/* LEVELS */
.levels{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:10px;
}

.levels button{
  background:#FF6A00;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  box-shadow:0 3px 0 #c84f00;
  cursor:pointer;
}

.levels button:active{
  transform:translateY(2px);
}

/* CONTROL BUTTONS */
.controls{
  margin:10px;
  display:flex;
  justify-content:center;
  gap:10px;
}

button.main{
  font-size:16px;
  padding:8px 14px;
  background:#FF6A00;
  color:white;
  border:none;
  border-radius:6px;
  box-shadow:0 3px 0 #c84f00;
}

button.main:active{
  transform:translateY(2px);
}

/* TEXT */
#text{
  padding:20px;
  max-width:900px;
  margin:auto;
  font-size:28px;
  line-height:1.6;
  text-align:justify;
  background:white;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* INFO */
#words,#time{
  position:fixed;
  right:10px;
  padding:6px 10px;
  border-radius:6px;
  font-size:14px;
}

#words{ bottom:10px; background:#ffe0b2; }
#time{ bottom:48px; background:#c8e6c9; }

@media (max-width:600px){
  #text{ font-size:22px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">ЛАВИНА</div>

  <div class="speed">
    <span>мед</span>
    <input id="speed" type="range" min="0" max="9" value="4">
    <span>быстр</span>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="paint"> белый</label>
    <label><input type="checkbox" id="reverseMode"> реверс</label>
  </div>

  <div class="font-controls">
    <span>A</span>
    <input id="fontSize" type="range" min="18" max="48" value="28">
    <span>A</span>

    <select id="fontFamily">
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Times New Roman">Times</option>
      <option value="Verdana">Verdana</option>
    </select>
  </div>
</header>

<div class="levels">
  <button onclick="setLevel('level_1')">1</button>
  <button onclick="setLevel('level_2')">2</button>
  <button onclick="setLevel('level_3')">3</button>
  <button onclick="setLevel('level_4')">4</button>
</div>

<div class="controls">
  <button class="main" id="start">Старт</button>
  <button class="main" id="stop">Стоп</button>
  <button class="main" id="repeat">Повтор</button>
</div>

<div id="text"></div>

<div id="words"></div>
<div id="time">Время: 0 сек</div>

<script>
const speeds=[2,1.75,1.5,1.25,1,0.75,0.5,0.4,0.25,0.1];

let data=null;
let texts=[];
let spans=[], originalWords=[];
let i=0, running=false, timer=null;
let startTime=0, clockInterval=null;
let currentLevel="level_1";

const textBox=document.getElementById("text");
const wordsBox=document.getElementById("words");
const timeBox=document.getElementById("time");

const speed=document.getElementById("speed");
const paint=document.getElementById("paint");
const reverseMode=document.getElementById("reverseMode");

const fontSize=document.getElementById("fontSize");
const fontFamily=document.getElementById("fontFamily");

async function loadJSON(){
  const res = await fetch("texts2.json");
  data = await res.json();
  setLevel("level_1");
}

function setLevel(level){
  currentLevel=level;
  texts=data[level].texts;
  showText();
}

/* FORMAT */
function formatWord(word){
  if(reverseMode.checked){
    let punct="";
    if(/[\.,!?:;]$/.test(word)){
      punct=word.slice(-1);
      word=word.slice(0,-1);
    }
    return word.split("").reverse().join("")+punct;
  }
  return word;
}

/* SHOW */
function showText(){
  let t=texts[i]?.text || texts[0].text;

  originalWords=t.split(" ");
  textBox.innerHTML=originalWords
    .map(w=>`<span>${formatWord(w)}</span>`)
    .join(" ");

  spans=[...textBox.querySelectorAll("span")];
  wordsBox.textContent="Слов: "+spans.length;

  applyFont();
}

/* FONT */
function applyFont(){
  textBox.style.fontSize = fontSize.value + "px";
  textBox.style.fontFamily = fontFamily.value;
}

fontSize.oninput=applyFont;
fontFamily.onchange=applyFont;

/* TIMER */
function startClock(){
  clockInterval=setInterval(()=>{
    timeBox.textContent="Время: "+Math.floor((Date.now()-startTime)/1000)+" сек";
  },200);
}

function stopClock(){
  clearInterval(clockInterval);
}

/* DISAPPEAR */
function disappearWord(){
  if(!running || i>=spans.length) return;

  for(let j=i;j<spans.length;j++){
    spans[j].textContent=formatWord(originalWords[j]);
  }

  if(paint.checked) spans[i].style.color="white";
  else spans[i].style.display="none";

  i++;
  wordsBox.textContent="Слов: "+(spans.length-i);

  if(i<spans.length){
    timer=setTimeout(disappearWord, speeds[speed.value]*1000);
  }else{
    running=false;
    stopClock();
  }
}

/* CONTROLS */
document.getElementById("start").onclick=()=>{
  running=true;
  i=0;
  startTime=Date.now();
  startClock();
  showText();
  disappearWord();
};

document.getElementById("stop").onclick=()=>{
  running=false;
  clearTimeout(timer);
  stopClock();
};

document.getElementById("repeat").onclick=()=>{
  running=false;
  clearTimeout(timer);
  i=0;
  showText();
  running=true;
  startTime=Date.now();
  startClock();
  disappearWord();
};

/* SPEED LIVE CHANGE */
speed.oninput=()=>{
  if(running){
    clearTimeout(timer);
    timer=setTimeout(disappearWord, speeds[speed.value]*1000);
  }
};

loadJSON();
</script>

</body>
</html>
