<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Что лишнее? — 4 уровня</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6fb;
  text-align:center;
}

.top{
  background:#1E3F8A;
  color:#fff;
  padding:14px;
  font-size:22px;
}

.wrap{max-width:600px;margin:auto;padding:12px;}

select,button{
  padding:10px;
  margin:6px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

button{background:#FF6A00;color:#fff;cursor:pointer;}

.hintBtn{
  background:#FFD54A;
  color:#000;
}

.rule{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
  color:#333;
  min-height:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(120px, 160px));
  grid-template-rows:repeat(2, minmax(120px, 160px));
  gap:14px;
  justify-content:center;
  margin-top:16px;
}

.card{
  width:100%;
  height:100%;

  font-size:54px;
  background:#fff;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,0.12);

  display:flex;
  align-items:center;
  justify-content:center;

  user-select:none;
}

@media (max-width: 480px){

  .grid{
    grid-template-columns:repeat(2, 45vw);
    grid-template-rows:repeat(2, 45vw);
    gap:10px;
  }

  .card{
    font-size:48px;
    border-radius:14px;
  }
}

#msg{margin-top:10px;font-size:18px;font-weight:bold;}
</style>
</head>

<body>

<div class="top">Что лишнее?</div>

<div class="wrap">

<select id="level" onchange="gen()">
  <option value="easy">EASY</option>
  <option value="medium">MEDIUM</option>
  <option value="hard">HARD</option>
  <option value="extreme">EXTREME</option>
</select>

<button onclick="gen()">Новый раунд</button>
<button class="hintBtn" onclick="toggleRule()">💡</button>

<div id="rule" class="rule"></div>
<div id="grid" class="grid"></div>
<div id="msg"></div>

</div>

<script>

let correct = "";
let currentRule = "";
let ruleVisible = false;

function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(a){
  return [...a].sort(()=>Math.random()-0.5);
}

/* =========================
   GAME DATA
========================= */

const GAME = {

/* ========== EASY ========== */
easy:{
  bank:{

    living:[
      "🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯",
      "🦁","🐮","🐷","🐸","🐵","🐔","🐦","🦆","🦅","🐟","🐙"
    ],

    non_living:[
      "🏠","🏢","🚗","🚲","✈️","🚢","📱","💻","📦","🎮","🔧"
    ],

    edible:[
      "🍎","🍌","🍓","🍇","🍒","🍑","🍍","🍊","🍉","🍞","🍔"
    ],

    non_edible:[
      "🚗","🏠","📱","💻","📦","🎮","🔧","⚙️"
    ],

    animal:[
      "🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐯","🐮","🐷","🐸"
    ],

    plant:[
      "🌳","🌲","🌴","🌵","🌿","🌸","🌼","🌻","🍀","🌱"
    ]

  },

  rules:[
    { name:"Живое / Неживое", a:"living", b:"non_living" },
    { name:"Съедобное / Несъедобное", a:"edible", b:"non_edible" },
    { name:"Животное / Растение", a:"animal", b:"plant" }
  ]
},

/* ========== MEDIUM ========== */
medium:{
  bank:{

    domestic:["🐶","🐱","🐮","🐷","🐴","🐑","🐐","🐔","🐰","🐹"],
    wild:["🐯","🦁","🐻","🦊","🐺","🐗","🐵","🐘","🦓","🦒"],

    water:["🐟","🐠","🐬","🐙","🦀","🐋"],
    land:["🐶","🐱","🐻","🦊","🐴","🐮","🐷","🐰"],

    fly:["🐦","🦅","🦉","🦋","🦇","🐝","✈️","🚁"],
    non_fly:["🐶","🐱","🐻","🦊","🐷","🐮","🚗","🚲"],

    fruit:["🍎","🍌","🍓","🍇","🍒","🍑","🍍","🍊"],
    veg:["🥕","🥒","🍅","🥦","🌽","🥬","🥔"]

  },

  rules:[
    { name:"Домашние / Дикие", a:"domestic", b:"wild" },
    { name:"Вода / Суша", a:"water", b:"land" },
    { name:"Летает / Не летает", a:"fly", b:"non_fly" },
    { name:"Фрукты / Овощи", a:"fruit", b:"veg" }
  ]
},

/* ========== HARD ========== */
hard:{
  bank:{

    /* =========================
       КРУГЛОЕ / УГЛОВАТОЕ
    ========================= */
    round:[
      "⚽","🏀","⚾","🎾","🏐",
      "🍎","🍊","🍇","🍓","🍒",
      "🔴","🟠","🟡","🟢","🔵","🟣",
      "⭕","🪩"
    ],

    angular:[
      "📦","🧱","📱","💻","🖥️",
      "📐","📏","📊","📋","🗂️",
      "🔲","⬛","🟦","🟥","🟨"
    ],

    /* =========================
       ГОРЯЧЕЕ / ХОЛОДНОЕ
    ========================= */
    hot:[
      "🔥","☀️","🌶️","🌋","🥵",
      "♨️","🌞","🍜"
    ],

    cold:[
      "❄️","🧊","⛄","🐧","🥶",
      "🌨️","🏔️","🧥"
    ],

    /* =========================
       ДВИЖЕНИЕ / СТАТИКА
    ========================= */
    moves:[
      "🐶","🐱","🐦","🐟","🐎",
      "🦁","🐆","🐅","🦅","🐬",
      "🚗","✈️","🚀","🚴","🏃"
    ],

    still:[
      "🚦","🏔️","🧱","🏠","🏢", 
      "📦","🗼","🪑","🖼️","📚" 
    ],

    /* =========================
       АКТИВНОСТЬ / ПАССИВНОСТЬ
    ========================= */
    active:[
      "⚡","🚀","💥","🏃","🎯",
      "🔥","🧨","🎮","🥊","⚔️"
    ],

    passive:[
      "📚","🛌","🧘","🪑","🏠",
      "📖","🕰️","🧩","🖼️","🌙"
    ]
  },

  rules:[
    { name:"Форма", a:"round", b:"angular" },
    { name:"Температура", a:"hot", b:"cold" },
    { name:"Движение", a:"moves", b:"still" },
    { name:"Активность", a:"active", b:"passive" }
  ]
},

/* ========== EXTREME ========== */
extreme:{
  bank:{

    /* =========================
       СОСТАВ: сложное / простое
    ========================= */
    composite:[
      "🚗","🚕","🚙","🚌","🚎",
      "🏠","🏢","🏭","🏬","🏫",
      "📱","💻","🖥️","📺","📷",
      "🚢","✈️","🚁","🚲","🏍️"
    ],

    simple:[
      "🔥","💧","🌳","🍎","🍊",
      "🍓","🍌","🌙","⭐","☀️",
      "🌊","⚡","🌫️","🌈","🌧️"
    ],

    /* =========================
       ИЗМЕНЧИВОЕ / СТАБИЛЬНОЕ
    ========================= */
    changing:[
      "🔥","🌊","☁️","🌱","🌪️",
      "🌧️","🌈","⚡","❄️","🌤️",
      "🌦️","🌬️"
    ],

    stable:[
      "🏠","🏢","🏭","🏫","🏬",
      "📦","🧱","🏛️","🪑","🖼️",
      "📚","⛩️","🏗️"
    ],

    /* =========================
       ПРИРОДНОЕ / ИСКУССТВЕННОЕ
    ========================= */
    natural:[
      "🐶","🐱","🐭","🐹","🐰",
      "🦊","🐻","🐼","🐯","🦁",
      "🌳","🌲","🌴","🌿","🍄",
      "🌊","🐟","🐬","🐦","🦋"
    ],

    artificial:[
      "🚗","🚕","🚙","🚌","🚎",
      "🏠","🏢","🏭","📱","💻",
      "📺","📷","🎮","🔧","🧰",
      "📦","🖥️","🚁","🚲","🏍️"
    ],

    /* =========================
       РЕАКТИВНОЕ / ИНЕРТНОЕ
    ========================= */
    reactive:[
      "🔥","🌊","⚡","🌪️","💥",
      "🌈","🌧️","☄️","🌬️","🌀",
      "🌦️"
    ],

    inert:[
      "🏠","🏢","🏭","📦","🧱",
      "🪑","🖼️","📚","🏛️","⛩️",
      "🏫","🏬","🏗️"
    ]

  },

  rules:[
    { name:"Состав", a:"composite", b:"simple" },
    { name:"Изменчивость", a:"changing", b:"stable" },
    { name:"Происхождение", a:"natural", b:"artificial" },
    { name:"Реактивность", a:"reactive", b:"inert" }
  ]
}

};

/* =========================
   GENERATOR (FIXED)
========================= */

function gen(){

  const lvl = document.getElementById("level").value;
  const data = GAME[lvl];

  const rule = rand(data.rules);
  currentRule = rule.name;

  const flip = Math.random() < 0.5;

  const main = flip ? rule.a : rule.b;
  const wrong = flip ? rule.b : rule.a;

  const good = shuffle(data.bank[main]).slice(0,3);
  const bad = rand(data.bank[wrong]);

  correct = bad;

  const set = shuffle([...good,bad]);

  document.getElementById("msg").textContent = "";

  updateRule();
  draw(set);
}

/* =========================
   UI
========================= */

function draw(arr){

  const g = document.getElementById("grid");
  g.innerHTML = "";

  arr.forEach(x=>{

    const d = document.createElement("div");
    d.className="card";
    d.textContent=x;

    d.onclick=()=>{
      document.getElementById("msg").textContent =
        x===correct ? "🎉 Верно!" : "❌ Попробуй ещё";
    };

    g.appendChild(d);
  });
}

/* =========================
   RULE TOGGLE
========================= */

function toggleRule(){
  ruleVisible = !ruleVisible;
  updateRule();
}

function updateRule(){
  document.getElementById("rule").textContent =
    ruleVisible ? ("Правило: " + currentRule) : "";
}

gen();

</script>

</body>
</html>
