<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доска</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Arial;
  background:#f5f5f5;
}

canvas{
  position:absolute;
  top:0;
  left:0;
  touch-action:none;
  background:#fff;
}

#panel{
  position:fixed;
  top:10px;
  left:10px;
  z-index:1000;
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:10px;
  border-radius:10px;
  width:240px;
}

#panel button,
#panel select,
#panel input{
  width:100%;
  margin:4px 0;
}
</style>
</head>

<body>

<div id="panel">
  Инструмент:
  <select id="tool">
    <option value="pen">Ручка</option>
    <option value="marker">Маркер</option>
    <option value="chalk">Мел</option>
    <option value="eraser">Тряпка</option>
  </select>

  Цвет:
  <input type="color" id="color" value="#000000">

  Размер:
  <input type="range" id="size" min="5" max="80" value="30">

  <button onclick="undo()">Undo</button>
  <button onclick="redo()">Redo</button>

  <button onclick="exportImage()">Открыть изображение</button>
  <button onclick="toggleFullscreen()">Полный экран</button>
  <button onclick="clearAll()">Очистить доску</button>
</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let dpr=window.devicePixelRatio||1;

let drawing=false;
let last=null;

let undoStack=[];
let redoStack=[];

/* resize */
function resize(){
  c.width=innerWidth*dpr;
  c.height=innerHeight*dpr;
  c.style.width=innerWidth+"px";
  c.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener("resize",resize);

/* save */
function save(){
  undoStack.push(c.toDataURL());
  if(undoStack.length>30) undoStack.shift();
  redoStack=[];
}

/* restore */
function restore(img){
  const image=new Image();
  image.onload=()=>{
    ctx.clearRect(0,0,c.width,c.height);
    ctx.drawImage(image,0,0,innerWidth,innerHeight);
  };
  image.src=img;
}

function undo(){
  if(!undoStack.length) return;
  redoStack.push(c.toDataURL());
  restore(undoStack.pop());
}

function redo(){
  if(!redoStack.length) return;
  undoStack.push(c.toDataURL());
  restore(redoStack.pop());
}

/* coords */
function pos(e){
  return {
    x:e.clientX,
    y:e.clientY
  };
}

/* draw line */
function drawLine(x1,y1,x2,y2,color,size,tool){
  ctx.strokeStyle=color;

  if(tool==="pen"){
    ctx.globalAlpha=1;
    ctx.lineWidth=size/6;
    ctx.lineCap="round";
  }

  if(tool==="marker"){
    ctx.globalAlpha=0.35;
    ctx.lineWidth=size/2;
    ctx.lineCap="butt";
  }

  if(tool==="chalk"){
    ctx.globalAlpha=0.25;
    ctx.lineWidth=size;
    ctx.lineCap="round";
    ctx.setLineDash([2,6]);
  }

  if(tool==="eraser"){
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=size;
    ctx.lineCap="round";
  }

  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=1;
}

/* draw */
function draw(e){
  if(!drawing) return;

  const p=pos(e);

  const tool=toolEl.value;
  const color=colorEl.value;
  const size=parseInt(sizeEl.value);

  if(!last) last=p;

  drawLine(last.x,last.y,p.x,p.y,color,size,tool);

  last=p;
}

/* start */
c.addEventListener("pointerdown",(e)=>{
  drawing=true;
  save();
  last=pos(e);
});

/* move */
c.addEventListener("pointermove",draw);

/* stop */
c.addEventListener("pointerup",()=>{
  drawing=false;
  last=null;
});

/* clear */
function clearAll(){
  save();

  ctx.clearRect(0,0,c.width,c.height);

  redoStack=[];
}

/* export (OPEN IMAGE) */
function exportImage(){
  const img=c.toDataURL("image/png");
  const w=window.open();
  w.document.write(`<img src="${img}" style="width:100%;">`);
}

/* fullscreen */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
}

/* controls */
const toolEl=document.getElementById("tool");
const colorEl=document.getElementById("color");
const sizeEl=document.getElementById("size");
</script>

</body>
</html>
