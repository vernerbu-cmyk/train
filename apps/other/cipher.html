<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дешифровщик</title>

<style>

:root{
--blue:#1E3F8A;
--orange:#FF6A00;
--bg:#0b1220;
--card:#111827;
--text:#fff;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
}

/* ===== TOP BAR ===== */

.topbar{
position:fixed;
top:0;
left:0;
right:0;
background:var(--blue);
padding:12px;
text-align:center;
font-style:italic;
font-weight:600;
color:#fff;
z-index:10;
}

/* ===== LAYOUT ===== */

.wrap{
width:100%;
max-width:560px;
padding:70px 14px 20px;
}

.panel{
background:var(--card);
border-radius:16px;
padding:16px;
border:1px solid rgba(255,255,255,0.08);
}

.code{
font-size:40px;
text-align:center;
margin:18px 0;
color:var(--orange);
letter-spacing:6px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:var(--orange);
color:#fff;
font-size:15px;
box-shadow:0 4px 0 #c94f00;
cursor:pointer;
}

button:active{
transform:translateY(3px);
box-shadow:0 1px 0 #c94f00;
}

/* ===== OVERLAY ===== */

#overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
}

/* ===== SHEET ===== */

#sheet{
position:fixed;
left:0;
right:0;
bottom:-100%;
height:75%;
background:#0f172a;
border-radius:18px 18px 0 0;
padding:18px 14px;
transition:0.25s ease;
overflow:auto;
box-shadow:0 -10px 40px rgba(0,0,0,0.5);
}

.sheetHeader{
font-size:22px;
font-weight:700;
color:var(--orange);
text-align:center;
margin-bottom:14px;
position:sticky;
top:0;
background:#0f172a;
padding:8px 0;
}

#table{
display:flex;
justify-content:center;
}

.grid{
display:grid;
grid-template-columns:repeat(4, max-content);
gap:10px;
justify-content:center;
}

.item{
display:inline-flex;
align-items:center;
gap:10px;
padding:10px 12px;
border:1px solid rgba(255,255,255,0.12);
border-radius:12px;
font-size:18px;
white-space:nowrap;
background:rgba(255,255,255,0.03);
}

.l{opacity:0.75;font-size:18px;min-width:18px;}
.s{font-weight:700;font-size:20px;color:var(--orange);}

.signature{
position:fixed;
bottom:6px;
right:10px;
font-size:10px;
opacity:0.4;
}

</style>
</head>

<body>

<div class="topbar">ДЕШИФРОВЩИК</div>

<div class="wrap">

<div class="panel">

<div class="code" id="code">---</div>

<button onclick="newWord()">НОВОЕ СЛОВО</button>
<button onclick="toggleTable()">ТАБЛИЦА ШИФРА</button>
<button onclick="printTable()">ПЕЧАТЬ</button>

</div>

</div>

<div id="overlay" onclick="toggleTable()"></div>

<div id="sheet">

<div class="sheetHeader">ТАБЛИЦА ШИФРА</div>

<div id="table"></div>

</div>

<div class="signature">© verner</div>

<script>

/* ===== DATA ===== */

const alphabet="АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";

const symbols=[
"●","○","■","□","▲","△","▼","▽",
"◆","◇","★","☆","♥","♦","♣","♠",
"⬤","◯","▣","▢","▰","▱","◼","◻",
"▮","▯","+","×","÷","=","≠","∞"
];

const key={};
alphabet.split("").forEach((l,i)=>key[l]=symbols[i]);

/* ===== JSON STATE ===== */

let words = [];
let current = "";

/* ===== LOAD JSON ===== */

async function loadWords(){

try{

const res = await fetch("words.json");

if(!res.ok){
console.warn("JSON fallback:", res.status);
words=["КОТ","ДОМ","ЛЕС"];
newWord();
return;
}

const data = await res.json();

if(Array.isArray(data)){
words = data.map(w => w.toUpperCase());
} else {
words = data.words?.map(w => w.toUpperCase()) || [];
}

console.log("WORDS LOADED:", words.length);

newWord();

}catch(e){
console.error("JSON ERROR:", e);
words=["КОТ","ДОМ","ЛЕС"];
newWord();
}

}

/* ===== GAME ===== */

function newWord(){
current = words[Math.floor(Math.random()*words.length)];
document.getElementById("code").innerText =
current.split("").map(c=>key[c]||"?").join(" ");
}

/* ===== SHEET ===== */

let open=false;

function toggleTable(){
open=!open;

document.getElementById("sheet").style.bottom =
open ? "0" : "-100%";

document.getElementById("overlay").style.display =
open ? "block" : "none";

if(open) renderTable();
}

/* ===== TABLE ===== */

function renderTable(){

const wrap=document.getElementById("table");
wrap.innerHTML="";

const grid=document.createElement("div");
grid.className="grid";

alphabet.split("").forEach(l=>{

const item=document.createElement("div");
item.className="item";

const a=document.createElement("span");
a.className="l";
a.textContent=l;

const b=document.createElement("span");
b.className="s";
b.textContent=key[l];

item.appendChild(a);
item.appendChild(b);
grid.appendChild(item);

});

wrap.appendChild(grid);
}

/* ===== PRINT ===== */

function printTable(){

const w = window.open("","_blank");

w.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Дешифровщик</title>

<style>

@page { margin: 10mm; }

body{
font-family:Arial;
padding:14px;
}

h2{
text-align:center;
font-size:20px;
margin:0 0 14px 0;
color:#FF6A00;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.item{
display:flex;
gap:10px;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
font-size:18px;
}

.s{
color:#FF6A00;
font-weight:bold;
font-size:22px;
}

</style>

</head>

<body>

<h2>ДЕШИФРОВЩИК</h2>

<div class="grid">
${alphabet.split("").map(l=>`
<div class="item">
<span>${l}</span>
<span class="s">${key[l]}</span>
</div>
`).join("")}
</div>

</body>
</html>
`);

w.document.close();
w.print();
}

/* ===== START ===== */

loadWords();

</script>

</body>
</html>
