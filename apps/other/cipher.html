<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHIFR PRO TRAINER</title>

<style>
:root{
--bg:#0b1220;
--card:#111827;
--line:rgba(255,255,255,.08);
--blue:#22d3ee;
--blue2:#93c5fd;
--text:#fff;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
}

.wrap{
width:100%;
max-width:560px;
padding:14px;
}

.panel{
background:var(--card);
border-radius:18px;
padding:16px;
margin-top:12px;
border:1px solid var(--line);
}

h1{
text-align:center;
color:var(--blue);
margin:0 0 10px;
}

.code{
font-size:40px;
text-align:center;
margin:18px 0;
color:var(--blue);
letter-spacing:8px;
}

button{
width:100%;
padding:11px;
border:none;
border-radius:12px;
margin-top:8px;
background:#334155;
color:#fff;
font-size:15px;
}

.primary{background:#0891b2;}

#overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
}

#drawer{
position:fixed;
top:0;
right:-420px;
width:360px;
height:100%;
background:#0f172a;
padding:16px;
overflow:auto;
transition:.25s;
box-shadow:-10px 0 40px rgba(0,0,0,.6);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.cell{
background:rgba(255,255,255,.04);
padding:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
}

.small{opacity:.7;}
.big{
font-size:22px;
color:var(--blue);
font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;
}

.printBtn{
background:#16a34a;
}

</style>
</head>

<body>

<div class="wrap">

<div class="panel">

<h1>🔐 SHIFR</h1>

<div class="code" id="code">---</div>

<button onclick="newWord()">🔁 Новое слово</button>
<button onclick="toggleDrawer()">📊 Таблица шифра</button>
<button class="printBtn" onclick="printTable()">🖨 Печать таблицы</button>

</div>

</div>

<div id="overlay" onclick="toggleDrawer()"></div>

<div id="drawer">
<h2 style="color:#93c5fd;">📊 Буква → Символ</h2>
<div id="table"></div>
</div>

<script>

/* ======================
DATA
====================== */

const alphabet="АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";

const symbols=[
"●","○","■","□","▲","△","▼","▽",
"◆","◇","★","☆","♥","♦","♣","♠",
"⬤","◯","▣","▢","▰","▱","◼","◻",
"▮","▯","+","×","÷","=","≠","∞"
];

const key={};
alphabet.split("").forEach((l,i)=>{
key[l]=symbols[i];
});

let words=["КОТ","ДОМ","ЛЕС"];
let current="";

/* ======================
LOAD OPTIONAL JSON SAFE
====================== */

async function loadWords(){
try{
const r=await fetch("words.json?v="+Date.now());
const d=await r.json();
if(Array.isArray(d)) words=d.map(x=>x.toUpperCase());
}catch(e){}
}

/* ======================
GAME
====================== */

function newWord(){
if(!words.length) return;

current=words[Math.floor(Math.random()*words.length)];

document.getElementById("code").innerText =
encode(current);
}

function encode(w){
return w.split("").map(c=>key[c]||"?").join(" ");
}

/* ======================
DRAWER
====================== */

let open=false;

function toggleDrawer(force=null){

open = force!==null ? force : !open;

document.getElementById("drawer").style.right =
open ? "0" : "-420px";

document.getElementById("overlay").style.display =
open ? "block" : "none";

if(open) renderTable();
}

/* ======================
TABLE (FIXED SAFE RENDER)
====================== */

function renderTable(){

const wrap=document.getElementById("table");
wrap.innerHTML="";

const grid=document.createElement("div");
grid.className="grid";

alphabet.split("").forEach(l=>{

const cell=document.createElement("div");
cell.className="cell";

const left=document.createElement("span");
left.className="small";
left.textContent=l;

const right=document.createElement("span");
right.className="big";
right.textContent=key[l];

cell.appendChild(left);
cell.appendChild(right);
grid.appendChild(cell);

});

wrap.appendChild(grid);
}

/* ======================
PRINT
====================== */
function printTable(){

const w = window.open("","_blank");

const html = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Шифр</title>

<style>

@page {
  margin: 10mm;
}

body{
font-family:Arial, sans-serif;
margin:0;
padding:10px;
}

h2{
text-align:center;
font-size:18px;
margin:0 0 10px 0;
}

.grid{
display:grid;
grid-template-columns:repeat(4, max-content);
gap:8px;
justify-content:start;
}

.item{
display:inline-flex;
justify-content:flex-start;
align-items:center;
gap:6px;
padding:4px 8px;
border:1px solid #ddd;
border-radius:6px;
font-size:16px;
line-height:1;
white-space:nowrap;
}

.l{
font-size:16px;
opacity:0.75;
min-width:16px;
}

.s{
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<h2>ШИФР</h2>

<div class="grid">
${alphabet.split("").map(l => `
  <div class="item">
    <div class="l">${l}</div>
    <div class="s">${key[l]}</div>
  </div>
`).join("")}
</div>

</body>
</html>
`;

w.document.write(html);
w.document.close();
w.print();
}
/* ======================
INIT
====================== */

loadWords();
newWord();

</script>

</body>
</html>
