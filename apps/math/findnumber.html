<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Найди цифру</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@200..700&family=Rubik+Mono+One&family=Comfortaa:wght@300..700&family=Caveat:wght@400..700&family=Nunito:wght@200..900&family=Pacifico&family=Montserrat:wght@300..900&family=Playfair+Display:wght@400..900&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

<style>

:root{
    --blue:#1E3F8A;
    --orange:#FF6A00;
    --bg:#0B1220;
    --panel:#111827;
    --text:#F3F4F6;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Montserrat,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* TOP */

#topbar{
    width:100%;
    background:var(--blue);
    padding:14px;
    text-align:center;
}

#title{
    color:#fff;
    font-size:34px;
    font-style:italic;
}

#controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:10px;
    flex-wrap:wrap;
}

.info{
    background:rgba(255,255,255,.1);
    padding:10px 14px;
    border-radius:12px;
}

.btn{
    background:var(--orange);
    border:none;
    padding:10px 16px;
    border-radius:12px;
    color:white;
    cursor:pointer;
}

/* FIELD */

#wrap{
    width:min(900px,95vw);
    height:min(900px,95vw);
    margin:20px;
    background:var(--panel);
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* NUM */

.num{
    position:absolute;
    user-select:none;
    cursor:pointer;
    transition:all .4s ease;
}

/* CENTER */

#centerPop{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:140px;
    font-weight:900;
    color:var(--orange);
    opacity:0;
    transform:scale(.6);
    transition:.25s;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="topbar">
    <div id="title">Найди цифру</div>

    <div id="controls">
        <div class="info" id="target">Найди: —</div>
        <div class="info" id="timer">0.000</div>
        <button class="btn" onclick="restart()">Перемешать</button>
    </div>
</div>

<div id="wrap"></div>

<div id="centerPop"></div>

<script>

const wrap = document.getElementById("wrap");
const targetEl = document.getElementById("target");
const timerEl = document.getElementById("timer");
const pop = document.getElementById("centerPop");

const SIZE = 900;
const COUNT = 99;

/* 🔥 более разнообразные и реально разные классы */
const fonts = [
"Anton",
"Bebas Neue",
"Oswald",
"Rubik Mono One",
"Comfortaa",
"Caveat",
"Nunito",
"Pacifico",
"Montserrat",
"Playfair Display",
"Unbounded"
];

let target = 1;
let start = performance.now();

function rand(a,b){return Math.random()*(b-a)+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function updateTimer(){
    timerEl.textContent =
        ((performance.now()-start)/1000).toFixed(3);
    requestAnimationFrame(updateTimer);
}
updateTimer();

function showCenter(n){
    pop.textContent = n;
    pop.style.opacity = 1;
    pop.style.transform = "scale(1)";
}

function hideCenter(){
    pop.style.opacity = 0;
    pop.style.transform = "scale(.6)";
}

function newTarget(){
    target = Math.floor(Math.random()*COUNT)+1;
    targetEl.textContent = "Найди: " + target;

    showCenter(target);

    setTimeout(hideCenter,600);
}

/* ================= SAFE BOUNDS ================= */

const SAFE = 55; // 🔥 больше защиты от вылета за экран

function collide(a,b,p=14){
    return !(
        a.x+a.w+p<b.x ||
        a.x>b.x+b.w+p ||
        a.y+a.h+p<b.y ||
        a.y>b.y+b.h+p
    );
}

function build(){

    wrap.innerHTML = "";

    const placed = [];

    const nums = Array.from({length:COUNT},(_,i)=>i+1)
        .sort(()=>Math.random()-0.5);

    nums.forEach(n=>{

        const el = document.createElement("div");
        el.className="num";
        el.textContent=n;

        const font = pick(fonts);
        el.style.fontFamily = font;

        const size = rand(16,72);
        el.style.fontSize = size+"px";
        el.style.fontWeight = 700;

        el.style.color = `hsl(${rand(0,360)},80%,60%)`;

        el.style.transform =
            `rotate(${rand(-25,25)}deg)`;

        wrap.appendChild(el);

        const rect = el.getBoundingClientRect();

        const w = Math.ceil(rect.width);
        const h = Math.ceil(rect.height);

        let ok=false;

        for(let i=0;i<5000;i++){

            const x = rand(
                SAFE,
                SIZE - w - SAFE
            );

            const y = rand(
                SAFE,
                SIZE - h - SAFE
            );

            const box={x,y,w,h};

            let bad=false;

            for(const p of placed){
                if(collide(box,p)){
                    bad=true;break;
                }
            }

            if(!bad){
                placed.push(box);

                el.style.left=x+"px";
                el.style.top=y+"px";

                ok=true;
                break;
            }
        }

        /* fallback (никогда не исчезает) */
        if(!ok){
            el.style.left = rand(SAFE,SIZE-SAFE-50)+"px";
            el.style.top = rand(SAFE,SIZE-SAFE-50)+"px";
        }

        el.onclick=()=>{
            if(n!==target) return;
            start = performance.now();
            newTarget();
            build();
        };

    });
}

function restart(){
    start = performance.now();
    newTarget();
    build();
}

newTarget();
build();

</script>

</body>
</html>
