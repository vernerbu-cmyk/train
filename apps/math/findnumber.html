<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Найди цифру</title>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&family=Comfortaa:wght@300..700&family=Caveat:wght@400..700&family=Nunito:wght@200..900&family=Pacifico&family=Montserrat:wght@300..900&display=swap" rel="stylesheet">

<style>

/* 🔥 FULL NO-SCROLL FIX */
html, body {
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    background:#0B1220;
    font-family:Montserrat;
}

/* PANEL */
#panel{
    width:220px;
    min-width:220px;
    background:#16233f;
    color:white;
    display:flex;
    flex-direction:column;
    padding:12px;
    gap:10px;
    box-sizing:border-box;
}

.box{
    background:rgba(255,255,255,0.08);
    padding:10px;
    border-radius:10px;
    font-weight:700;
}

button{
    background:#FF6A00;
    border:none;
    padding:10px;
    border-radius:10px;
    color:white;
    font-weight:800;
    cursor:pointer;
}

button:active{
    transform:translateY(2px);
}

/* FIELD (FIXED HEIGHT LOGIC) */
#wrap{
    flex:1;
    position:relative;
    background:#111827;
    overflow:hidden;
}

/* NUM */
.num{
    position:absolute;
    transform:translate(-50%,-50%);
    user-select:none;
    font-weight:800;
    cursor:pointer;
    pointer-events:auto;
}

/* CENTER POP */
#center{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:140px;
    font-weight:900;
    color:#FF6A00;
    pointer-events:none;
    opacity:0;
    transition:opacity .25s;
}

/* MOBILE */
@media (max-width: 768px){
    body{
        flex-direction:column;
    }

    #panel{
        width:100%;
        flex-direction:row;
        flex-wrap:wrap;
        justify-content:space-between;
    }

    #wrap{
        height:calc(100vh - 140px);
    }
}

</style>
</head>

<body>

<div id="panel">

    <div class="box" id="target">Найди: —</div>
    <div class="box" id="timer">0.000</div>

    <div class="box">
        Сложность:
        <select id="diff" onchange="setDifficulty(this.value)">
            <option value="easy">easy</option>
            <option value="normal" selected>normal</option>
            <option value="hard">hard</option>
        </select>
    </div>

    <button onclick="resetGame()">Заново</button>

</div>

<div id="wrap"></div>

<div id="center"></div>

<script>

const wrap = document.getElementById("wrap");
const targetEl = document.getElementById("target");
const timerEl = document.getElementById("timer");
const center = document.getElementById("center");

const COUNT = 99;

const DIFF = {
    easy:   { speed:0.7, size:1.25, force:0.6 },
    normal: { speed:1.0, size:1.0,  force:1.0 },
    hard:   { speed:1.5, size:0.75, force:1.4 }
};

let difficulty = DIFF.normal;

function setDifficulty(val){
    difficulty = DIFF[val] || DIFF.normal;
    resetGame();
}

const fonts = [
"Unbounded","Comfortaa","Caveat","Nunito","Pacifico","Montserrat"
];

function rand(a,b){return Math.random()*(b-a)+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

let items = [];
let target = 1;
let start = performance.now();

let mouseX = -9999;
let mouseY = -9999;
let pressed = false;

/* TIMER */
setInterval(()=>{
    timerEl.textContent =
        ((performance.now()-start)/1000).toFixed(3);
},50);

/* POINTER */
wrap.addEventListener("pointermove",(e)=>{
    const r = wrap.getBoundingClientRect();
    mouseX = e.clientX - r.left;
    mouseY = e.clientY - r.top;
});

wrap.addEventListener("pointerdown",()=>pressed=true);
wrap.addEventListener("pointerup",()=>pressed=false);

/* CENTER POP */
function showCenter(){
    center.textContent = target;
    center.style.opacity = 1;
    setTimeout(()=>center.style.opacity=0,400);
}

/* TARGET */
function setTarget(){
    target = Math.floor(Math.random()*COUNT)+1;
    targetEl.textContent = "Найди: " + target;
    showCenter(); // 🔥 FIX ALWAYS SHOW
}

/* BUILD */
function build(){

    wrap.innerHTML = "";
    items = [];

    const W = wrap.clientWidth;
    const H = wrap.clientHeight;

    const nums = Array.from({length:COUNT},(_,i)=>i+1)
        .sort(()=>Math.random()-0.5);

    for(const n of nums){

        const el = document.createElement("div");
        el.className="num";
        el.textContent=n;

        const size =
            (Math.random()<0.15 ? 80 :
            Math.random()<0.40 ? 55 : 32)
            * difficulty.size;

        el.style.fontSize = size+"px";
        el.style.fontFamily = pick(fonts);
        el.style.color = `hsl(${Math.random()*360},80%,60%)`;

        wrap.appendChild(el);

        const obj = {
            el,
            val:n,
            r:size*0.55,
            x:rand(0,W),
            y:rand(0,H),
            vx:rand(-1,1)*difficulty.speed,
            vy:rand(-1,1)*difficulty.speed,
            rot:rand(-40,40),
            skew:rand(-0.3,0.3)
        };

        el.addEventListener("pointerdown",(e)=>{
            e.stopPropagation();
            if(obj.val !== target) return;

            start = performance.now();
            resetGame();
        });

        items.push(obj);
    }

    setTarget();
}

/* RESET */
function resetGame(){

    const W = wrap.clientWidth;
    const H = wrap.clientHeight;

    for(const o of items){
        o.x = rand(0,W);
        o.y = rand(0,H);
        o.vx = rand(-1,1)*difficulty.speed;
        o.vy = rand(-1,1)*difficulty.speed;
    }

    setTarget();
}

/* ANIMATE */
function animate(){

    const W = wrap.clientWidth;
    const H = wrap.clientHeight;

    for(const o of items){

        o.x += o.vx;
        o.y += o.vy;

        o.vx *= 0.995;
        o.vy *= 0.995;

        const MAX = 2.5 * difficulty.speed;
        o.vx = Math.max(-MAX, Math.min(MAX,o.vx));
        o.vy = Math.max(-MAX, Math.min(MAX,o.vy));

        if(o.x < o.r){ o.x=o.r; o.vx*=-1; }
        if(o.x > W-o.r){ o.x=W-o.r; o.vx*=-1; }

        if(o.y < o.r){ o.y=o.r; o.vy*=-1; }
        if(o.y > H-o.r){ o.y=H-o.r; o.vy*=-1; }

        if(pressed){

            const dx = o.x - mouseX;
            const dy = o.y - mouseY;
            const d = Math.hypot(dx,dy);

            const radius = 120;

            if(d < radius && d > 0.001){
                const f = (1 - d/radius) * difficulty.force;
                o.vx += dx/d * f;
                o.vy += dy/d * f;
            }
        }

        o.el.style.left = o.x+"px";
        o.el.style.top = o.y+"px";

        o.el.style.transform =
            `translate(-50%,-50%) rotate(${o.rot}deg) skew(${o.skew}deg,${o.skew}deg)`;
    }

    requestAnimationFrame(animate);
}

/* INIT */
build();
animate();

</script>

</body>
</html>
